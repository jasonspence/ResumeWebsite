<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing And Spelling</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="back-button" href="../projects.html">← Back to projects</a>
    <main class="app">
      <h1>Typing And Spelling</h1>
      <p class="subtitle">Type each word exactly to advance. If you didn't know it, look it up.</p>

      <section class="card">
        <label for="wordInput">Word: <span id="promptWord" aria-live="polite"></span></label>
        <input id="wordInput" type="text" placeholder="Type the word" autocomplete="off" />
        <button id="restartButton" type="button">Restart</button>
        <p id="scoreDisplay" class="score" aria-live="polite">Words typed: 0 | Streak: 0 | Correct letters: 0 | Mistakes: 0</p>
        <p id="efficiencyDisplay" class="score" aria-live="polite">Efficiency: 0/0 (0.0%) | Top streak: 0</p>
        <p id="feedback" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="previousWordHeading">
        <div class="developer-controls-header">
          <h2 id="previousWordHeading" class="previous-word-heading">Previous Word: <span id="previousWord"></span></h2>
          <button id="developerModeButton" class="mode-toggle" type="button" aria-pressed="false">Developer Mode</button>
        </div>
        <button id="definePreviousButton" type="button">Define Previous Word</button>
        <button id="trashPreviousButton" type="button" hidden>Move To Trash</button>
        <button id="downloadListsButton" type="button" hidden disabled>Download Updated Lists</button>
        <p class="shortcutHint">Shortcuts: 0 Restart | 1 Define</p>
        <p id="definitionDisplay" class="definition" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
